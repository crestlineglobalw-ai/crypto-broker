<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Crestline Global</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #262d3a;
            --input-bg: #0e121a;
            --danger: #ef4444;
            --header-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .site-header {
            height: var(--header-height);
            background-color: rgba(21, 26, 35, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-container {
            max-width: 1400px;
            height: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .admin-tag {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .auth-container {
            max-width: 440px;
            width: 100%;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .admin-badge-icon {
            width: 56px;
            height: 56px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.5rem;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #f87171;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .auth-footer a:hover {
            color: var(--text-main);
        }

        footer {
            border-top: 1px solid var(--border-color);
            background-color: #080b10;
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <span class="brand-name">Crestline Global</span>
            <span class="admin-tag">Admin Control Center</span>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="admin-badge-icon">🛡️</div>
            <div class="auth-header">
                <h1>Admin Portal</h1>
                <p>Restricted access for platform managers</p>
            </div>

            <div id="errorMessage" class="error-message">
                Invalid admin credentials. Please try again.
            </div>

            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="adminEmail">Admin Email</label>
                    <input type="email" id="adminEmail" class="form-input" placeholder="Enter admin email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" class="form-input" placeholder="Enter admin password" required>
                </div>

                <button type="submit" class="btn-submit">Sign In to Admin Console</button>
            </form>

            <div class="auth-footer">
                <a href="login.html">← Switch to Standard User Login</a>
            </div>
        </div>
    </div>

    <footer>
        © 2026 Crestline Global. Internal System.
    </footer>

    <script>
        // Updated pre-registered admin credentials
        const ADMIN_EMAIL = "admin123@admin.com";
        const ADMIN_PASSWORD = "admin123@";

        function handleAdminLogin(e) {
            e.preventDefault();

            const emailInput = document.getElementById('adminEmail').value.trim();
            const passwordInput = document.getElementById('adminPassword').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            if (emailInput === ADMIN_EMAIL && passwordInput === ADMIN_PASSWORD) {
                errorDiv.style.display = "none";
                window.location.href = "admin-dashboard.html";
            } else {
                errorDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
