<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Crestline Global</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #262d3a;
            --input-bg: #0e121a;
            --danger: #ef4444;
            --header-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HEADER & NAV */
        .site-header {
            height: var(--header-height);
            background-color: rgba(21, 26, 35, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1400px;
            height: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-chart-box {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        .logo-chart-box svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #000000;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-secondary {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .auth-container {
            max-width: 440px;
            width: 100%;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #f87171;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--primary);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        footer {
            border-top: 1px solid var(--border-color);
            background-color: #080b10;
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- SITE HEADER -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-chart-box">
                    <svg viewBox="0 0 24 24">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                </div>
                <span class="brand-name">Crestline Global</span>
            </a>

            <div class="header-actions">
                <a href="login.html" class="btn-secondary">Log In</a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Sign In</h1>
                <p>Enter your credentials to access your portal</p>
            </div>

            <div id="errorMessage" class="error-message">
                Invalid email or password. Please try again.
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </div>
    </div>

    <footer>
        © 2026 Crestline Global. All rights reserved.
    </footer>

    <script>
        // Credentials configuration
        const USER_EMAIL = "user123@user.com";
        const USER_PASSWORD = "user123@";

        const ADMIN_EMAIL = "admin123@admin.com";
        const ADMIN_PASSWORD = "admin123@";

        function handleLogin(e) {
            e.preventDefault();

            const emailInput = document.getElementById('loginEmail').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            // Route to User Dashboard
            if (emailInput === USER_EMAIL && passwordInput === USER_PASSWORD) {
                errorDiv.style.display = "none";
                window.location.href = "user-dashboard.html";
            } 
            // Route to Admin Dashboard
            else if (emailInput === ADMIN_EMAIL && passwordInput === ADMIN_PASSWORD) {
                errorDiv.style.display = "none";
                window.location.href = "admin-dashboard.html";
            } 
            // Show error for invalid inputs
            else {
                errorDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
