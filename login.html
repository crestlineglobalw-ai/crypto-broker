<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Crestline Global</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background-color: #181a20; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #2b313a; }
        .brand { text-align: center; font-size: 24px; font-weight: bold; color: #f0b90b; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #848e9c; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; background-color: #0b0e11; border: 1px solid #2b313a; border-radius: 4px; color: #fff; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background-color: #f0b90b; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <div class="brand"><i class="fa-solid fa-chart-line"></i> Crestline Global</div>
        <h3 style="text-align: center; margin-bottom: 20px;">Log In to Dashboard</h3>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            // Store active login session state
            sessionStorage.setItem("userLoggedIn", "true");
            window.location.href = "wallet.html";
        }
    </script>

</body>
</html>
