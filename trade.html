<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Trading | Crestline Global</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AUTHENTICATION GUARD -->
    <script src="auth.js"></script>
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: #181a20;
            --border-color: #2b313a;
            --accent-gold: #f0b90b;
            --text-main: #ffffff;
            --text-muted: #848e9c;
        }

        body { background-color: var(--bg-dark); color: var(--text-main); font-family: Arial, sans-serif; margin: 0; }
        a { text-decoration: none; color: inherit; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .brand-logo { font-size: 20px; font-weight: 800; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
        .nav-links a { margin-left: 20px; font-size: 14px; font-weight: 600; }
        .nav-links a:hover { color: var(--accent-gold); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 8px; }
    </style>
</head>
<body>

    <nav>
        <a href="dashboard.html" class="brand-logo"><i class="fa-solid fa-chart-line"></i> Crestline Global</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="wallet.html">Deposit/Wallet</a>
            <a href="trade.html" style="color: var(--accent-gold);">Spot Trade</a>
            <a href="kyc.html">Verification</a>
            <button onclick="logoutUser()" style="background-color: var(--accent-gold); color: #000; padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; margin-left: 15px;">Log Out</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Spot Trading Engine</h2>
            <p style="color: var(--text-muted);">Trade BTC, XRP, SOL, ADA, BNB, and USDT in real-time.</p>
            <div style="padding: 50px; text-align: center; border: 1px dashed var(--border-color); margin-top: 20px;">
                <i class="fa-solid fa-chart-candlestick" style="font-size: 48px; color: var(--accent-gold); margin-bottom: 15px;"></i>
                <h3>Live Orderbook & Chart Module</h3>
                <p style="color: var(--text-muted);">Authenticated session confirmed. Trading interface active.</p>
            </div>
        </div>
    </div>

</body>
</html>
