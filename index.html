<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crestline Global</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --header-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .site-header {
            height: var(--header-height);
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            height: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background-color: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--text-muted);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border: 1px solid var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* HERO SECTION */
        .hero-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-content h1 {
            font-size: 2.75rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.25rem;
        }

        .hero-content p {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .hero-cta {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .hero-cta .btn {
            padding: 0.75rem 1.75rem;
            font-size: 1rem;
        }

        /* FOOTER */
        .site-footer {
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">C</div>
                <span class="brand-name">Crestline Global</span>
            </a>

            <!-- Public controls only -->
            <div id="public-header-actions" class="header-actions">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary">Sign Up</a>
            </div>

            <!-- Dashboard access for logged-in users only -->
            <div id="user-header-actions" class="header-actions" style="display: none;">
                <a href="dashboard.html" class="btn btn-primary">Dashboard</a>
                <button id="logout-btn" class="btn btn-outline" onclick="logoutUser()">Log Out</button>
            </div>
        </div>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h1>Secure Digital Asset Infrastructure</h1>
            <p>Institutional-grade performance and high-security access for trading, managing, and storing global assets seamlessly.</p>
            <div class="hero-cta" id="hero-cta-group">
                <a href="register.html" class="btn btn-primary">Get Started</a>
                <a href="login.html" class="btn btn-outline">Sign In</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Crestline Global. All rights reserved.</p>
    </footer>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
            const publicActions = document.getElementById('public-header-actions');
            const userActions = document.getElementById('user-header-actions');
            const heroCtaGroup = document.getElementById('hero-cta-group');

            if (token) {
                if (publicActions) publicActions.style.display = 'none';
                if (userActions) userActions.style.display = 'flex';
                if (heroCtaGroup) {
                    heroCtaGroup.innerHTML = `<a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>`;
                }
            } else {
                if (publicActions) publicActions.style.display = 'flex';
                if (userActions) userActions.style.display = 'none';
            }
        });

        function logoutUser() {
            localStorage.removeItem('authToken');
            sessionStorage.removeItem('authToken');
            window.location.reload();
        }
    </script>
</body>
</html>
