<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Crestline Global</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --card-hover: #1c2330;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #262d3a;
            --input-bg: #0e121a;
            --success: #22c55e;
            --danger: #ef4444;
            --header-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HEADER & NAV */
        .site-header {
            height: var(--header-height);
            background-color: rgba(21, 26, 35, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1400px;
            height: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-chart-box {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        .logo-chart-box svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #000000;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-secondary {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* REGISTER CONTAINER */
        .auth-container {
            max-width: 480px;
            width: 100%;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .referral-box {
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin: 1.5rem 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 0.15rem;
            accent-color: var(--primary);
        }

        .checkbox-group a {
            color: var(--primary);
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--primary);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .error-banner {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--border-color);
            background-color: #080b10;
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- SITE HEADER -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-chart-box">
                    <svg viewBox="0 0 24 24">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                </div>
                <span class="brand-name">Crestline Global</span>
            </a>

            <div class="header-actions">
                <a href="login.html" class="btn-secondary">Log In</a>
            </div>
        </div>
    </header>

    <!-- REGISTER CARD CONTAINER -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join 15M+ users trading digital assets globally</p>
            </div>

            <div id="registerErrorMsg" class="error-banner"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="fullname">Full Name</label>
                    <input type="text" id="fullname" class="form-input" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Minimum 8 characters" required>
                </div>

                <!-- CONFIRM PASSWORD FIELD -->
                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter your password" required>
                </div>

                <!-- REFERRAL CODE (OPTIONAL) -->
                <div class="form-group referral-box">
                    <label class="form-label" for="referral">Referral Code <span style="color: var(--text-muted); font-weight: normal;">(Optional)</span></label>
                    <input type="text" id="referral" class="form-input" placeholder="Enter invitation or promo code">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        © 2026 Crestline Global. All rights reserved.
    </footer>

    <script>
        function handleRegister(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorBanner = document.getElementById('registerErrorMsg');

            // Validate matching passwords
            if (password !== confirmPassword) {
                errorBanner.textContent = "Passwords do not match. Please check and try again.";
                errorBanner.style.display = "block";
                return;
            }

            // Retrieve registered users array from localStorage
            let users = JSON.parse(localStorage.getItem('crestline_users')) || [];

            // Check if email is already registered
            const existingUser = users.find(u => u.email === email);
            if (existingUser) {
                errorBanner.textContent = "An account with this email already exists. Please log in.";
                errorBanner.style.display = "block";
                return;
            }

            // Create new user profile object
            const newUser = {
                fullName: fullName,
                email: email,
                password: password,
                createdAt: new Date().toISOString()
            };

            // Save user back into the array database
            users.push(newUser);
            localStorage.setItem('crestline_users', JSON.stringify(users));

            // Set active session log-in immediately
            localStorage.setItem('crestline_logged_in_user', JSON.stringify(newUser));

            // Redirect smoothly to dashboard
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
