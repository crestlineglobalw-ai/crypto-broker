<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Crypto Broker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e2329; width: 100%; max-width: 420px; padding: 32px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { font-size: 24px; margin-bottom: 24px; text-align: center; color: #f0b90b; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #848e9c; }
        input { width: 100%; padding: 12px; background: #2b313a; border: 1px solid #474d57; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #f0b90b; }
        .btn { width: 100%; padding: 12px; background: #f0b90b; border: none; border-radius: 6px; color: #0e1114; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #d8a407; }
        .footer-text { margin-top: 18px; text-align: center; font-size: 13px; color: #848e9c; }
        .footer-text a { color: #f0b90b; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Create Account</h2>
    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" required placeholder="+1234567890">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="Enter password">
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" required placeholder="Confirm password">
        </div>
        <div class="form-group">
            <label>Referral Code (Optional)</label>
            <input type="text" id="referralCode" placeholder="e.g. REF12345">
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    <div class="footer-text">
        Already have an account? <a href="login.html">Log In</a>
    </div>
</div>

<script>
    function handleRegister(event) {
        event.preventDefault();
        const pwd = document.getElementById('password').value;
        const confirmPwd = document.getElementById('confirmPassword').value;
        if (pwd !== confirmPwd) {
            alert("Passwords do not match!");
            return;
        }
        alert("Registration submitted successfully!");
    }
</script>

</body>
</html>
