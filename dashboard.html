<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Crestline Global</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AUTHENTICATION GUARD -->
    <script src="auth.js"></script>
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: #181a20;
            --border-color: #2b313a;
            --accent-gold: #f0b90b;
            --text-main: #ffffff;
            --text-muted: #848e9c;
            --green: #0ecb81;
        }

        body { background-color: var(--bg-dark); color: var(--text-main); font-family: Arial, sans-serif; margin: 0; }
        a { text-decoration: none; color: inherit; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .brand-logo { font-size: 20px; font-weight: 800; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
        .nav-links a { margin-left: 20px; font-size: 14px; font-weight: 600; }
        .nav-links a:hover { color: var(--accent-gold); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 8px; }
        .card-title { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        .card-value { font-size: 28px; font-weight: bold; }

        .action-btn {
            background-color: var(--accent-gold);
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="dashboard.html" class="brand-logo"><i class="fa-solid fa-chart-line"></i> Crestline Global</a>
        <div class="nav-links">
            <a href="dashboard.html" style="color: var(--accent-gold);">Dashboard</a>
            <a href="wallet.html">Deposit/Wallet</a>
            <a href="trade.html">Spot Trade</a>
            <a href="kyc.html">Verification</a>
            <button onclick="logoutUser()" class="action-btn" style="padding: 6px 12px; font-size: 12px; margin-top: 0; margin-left: 15px;">Log Out</button>
        </div>
    </nav>

    <div class="container">
        <h2>User Dashboard</h2>
        <p style="color: var(--text-muted);">Welcome back. Here is your current account overview.</p>

        <div class="overview-grid">
            <div class="card">
                <div class="card-title">Total Balance (USD)</div>
                <div class="card-value">$12,450.80</div>
                <a href="wallet.html" class="action-btn">Deposit Funds</a>
            </div>
            <div class="card">
                <div class="card-title">Account Status</div>
                <div class="card-value" style="color: var(--green);"><i class="fa-solid fa-shield-halved"></i> Active</div>
                <a href="kyc.html" class="action-btn" style="background-color: transparent; border: 1px solid var(--border-color); color: #fff;">View KYC Status</a>
            </div>
            <div class="card">
                <div class="card-title">Active Trades</div>
                <div class="card-value">3 Open</div>
                <a href="trade.html" class="action-btn" style="background-color: transparent; border: 1px solid var(--border-color); color: #fff;">Go to Trading</a>
            </div>
        </div>
    </div>

</body>
</html>
