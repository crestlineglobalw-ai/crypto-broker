<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification | Crestline Global</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: #181a20;
            --border-color: #2b313a;
            --accent-gold: #f0b90b;
            --text-main: #ffffff;
            --text-muted: #848e9c;
        }

        body { background-color: var(--bg-dark); color: var(--text-main); font-family: Arial, sans-serif; margin: 0; }
        a { text-decoration: none; color: inherit; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .brand-logo { font-size: 20px; font-weight: 800; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }

        .container { max-width: 600px; margin: 50px auto; padding: 30px; background-color: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-submit { width: 100%; padding: 12px; background-color: var(--accent-gold); color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand-logo"><i class="fa-solid fa-chart-line"></i> Crestline Global</a>
        <div>
            <a href="wallet.html" style="color: var(--text-muted);">Back to Wallet</a>
        </div>
    </nav>

    <div class="container">
        <h2>Account Verification (KYC)</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">Complete verification inside your dashboard to enable external account withdrawals.</p>

        <form action="wallet.html">
            <div class="form-group">
                <label>Full Legal Name</label>
                <input type="text" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Document Type</label>
                <select required>
                    <option value="">Select ID Type</option>
                    <option value="passport">Passport</option>
                    <option value="id">National ID Card</option>
                    <option value="driver">Driver's License</option>
                </select>
            </div>
            <div class="form-group">
                <label>Upload ID Front</label>
                <input type="file" required>
            </div>
            <div class="form-group">
                <label>Upload ID Back</label>
                <input type="file" required>
            </div>
            <button type="submit" class="btn-submit">Submit Verification</button>
        </form>
    </div>

</body>
</html>
