<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Verification - Crypto Broker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e2329; width: 100%; max-width: 480px; padding: 32px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { font-size: 22px; margin-bottom: 8px; color: #f0b90b; text-align: center; }
        p.subtitle { font-size: 13px; color: #848e9c; text-align: center; margin-bottom: 24px; }
        .upload-section { margin-bottom: 20px; background: #2b313a; padding: 16px; border-radius: 8px; border: 1px dashed #474d57; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #eaecef; font-weight: bold; }
        input[type="file"] { width: 100%; color: #848e9c; font-size: 13px; }
        .btn { width: 100%; padding: 12px; background: #0ecb81; border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0baf6f; }
    </style>
</head>
<body>

<div class="card">
    <h2>Identity Verification</h2>
    <p class="subtitle">Upload official documents to unlock deposits and withdrawals.</p>
    
    <form id="kycForm" onsubmit="handleKYC(event)">
        <div class="upload-section">
            <label>1. Government ID / Passport</label>
            <input type="file" id="idDocument" accept="image/*,.pdf" required>
        </div>

        <div class="upload-section">
            <label>2. Facial Verification (Live Selfie)</label>
            <input type="file" id="facialSelfie" accept="image/*" capture="user" required>
        </div>

        <button type="submit" class="btn">Submit Documents for Review</button>
    </form>
</div>

<script>
    function handleKYC(event) {
        event.preventDefault();
        alert("Verification documents uploaded successfully! Your status is PENDING review.");
    }
</script>

</body>
</html>
